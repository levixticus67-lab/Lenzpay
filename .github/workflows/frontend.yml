name: Frontend checks and Vercel deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm to avoid runner-bundled npm failure
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Run API unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          npm ci --no-audit --no-fund
          test -x node_modules/.bin/prisma
          npm run db:generate
          npm test

      - name: Install dashboard dependencies
        working-directory: client
        run: npm ci

      - name: Build dashboard for pull requests and before Vercel is enabled
        if: github.ref != 'refs/heads/main' || vars.VERCEL_DEPLOY_ENABLED != 'true' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
        working-directory: client
        run: npm run build

      - name: Install Vercel CLI
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt dashboard to Vercel
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
